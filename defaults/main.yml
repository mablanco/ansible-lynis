---
# How to install Lynis: tar, git, pkg (CISOfy's official repository) or
# distro (the distribution's own package)
lynis_deploy_method: tar
lynis_home: /opt/lynis

# tar and git methods. When you change the version, update the checksum too:
# it is the SHA-256 of GitHub's tarball of the release tag. CISOfy's own
# tarball is GPG-signed, but downloads.cisofy.com rejects Ansible's requests
# (HTTP 403). For 3.1.7, every file of the signed tarball is identical in
# GitHub's one, which only adds repository files and two community plugins.
lynis_version: "3.1.7"
lynis_url: https://github.com/CISOfy/lynis/archive/refs/tags
lynis_package: "{{ lynis_version }}.tar.gz"
lynis_tar_checksum: sha256:48d829d0dc2c583a3e838cc09a7190b69a3af844bcb913c7cf9c0226b04b95c5
lynis_git_repo: https://github.com/CISOfy/lynis

# Weekly audit
lynis_cron_hour: "6"
lynis_cron_minute: "30"
lynis_cron_dow: "7"
lynis_report_from: ""
lynis_report_to: ""
lynis_log_expire: 90

# Tests to skip, as a list of test codes
lynis_tests_to_skip: []
