---
- name: Lynis | Check the role variables
  ansible.builtin.assert:
    that:
      - lynis_report_from | length > 0
      - lynis_report_to | length > 0
      - lynis_deploy_method in ['tar', 'git', 'pkg', 'distro']
    fail_msg: >-
      Set lynis_report_from and lynis_report_to, and set lynis_deploy_method
      to tar, git, pkg or distro.
    quiet: true

# Older versions of this role added CISOfy's repository for a codename that
# CISOfy no longer publishes, which makes apt fail to update its cache
- name: Lynis | Remove the APT repository of older versions of this role
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cisofy-lynis.list
    state: absent
  when: ansible_facts['os_family'] == 'Debian'

- name: Lynis | Update the package cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Lynis | Install Lynis
  ansible.builtin.include_tasks: "install-{{ lynis_deploy_method }}.yml"

- name: Lynis | Install cron
  ansible.builtin.package:
    name: "{{ 'cronie' if ansible_facts['os_family'] == 'RedHat' else 'cron' }}"
    state: present

- name: Lynis | Create the configuration directory
  ansible.builtin.file:
    path: /etc/lynis
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Lynis | Install the custom profile
  ansible.builtin.template:
    src: lynis.custom.prf.j2
    dest: /etc/lynis/custom.prf
    owner: root
    group: root
    mode: "0640"

- name: Lynis | Create the log directory
  ansible.builtin.file:
    path: /var/log/lynis
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Lynis | Install the audit script
  ansible.builtin.template:
    src: lynis.cron.j2
    dest: /usr/local/bin/lynis_cron.sh
    owner: root
    group: root
    mode: "0750"

- name: Lynis | Schedule the weekly audit
  ansible.builtin.cron:
    name: Launch Lynis security audit
    hour: "{{ lynis_cron_hour }}"
    minute: "{{ lynis_cron_minute }}"
    weekday: "{{ lynis_cron_dow }}"
    cron_file: lynis
    user: root
    job: /usr/local/bin/lynis_cron.sh 2>&1 | logger -t lynis
