name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch changes in the distributions' packages
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ci:
    uses: mablanco/shared-github-workflows/.github/workflows/ansible-role-ci.yml@main
    with:
      # One run per installation method
      molecule-matrix: >-
        [{"name": "tar", "env": "LYNIS_DEPLOY_METHOD=tar"},
         {"name": "git", "env": "LYNIS_DEPLOY_METHOD=git"},
         {"name": "pkg", "env": "LYNIS_DEPLOY_METHOD=pkg"},
         {"name": "distro", "env": "LYNIS_DEPLOY_METHOD=distro"}]
